<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Form Produk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>UMKM Toko Online - Modul Katalog Produk</h1>
</div>

<div class="container">
  <h2>Form Tambah / Edit Produk</h2>

  <form>

    <div class="form-section">
      <h3>Informasi Dasar</h3>

      <div class="form-group">
        <label>Nama Produk</label>
        <input type="text" placeholder="Contoh: Kaos Polos Katun Combed">
      </div>

      <div class="form-group">
        <label>SKU</label>
        <input type="text" placeholder="KTS-001">
      </div>

      <div class="form-group">
        <label>Merek</label>
        <select>
          <option>Brand A</option>
          <option>Brand B</option>
          <option>Brand C</option>
        </select>
      </div>

      <div class="form-group">
        <label>Kategori</label>
        <select>
          <option>Fashion</option>
          <option>Elektronik</option>
          <option>Makanan</option>
          <option>Kerajinan</option>
        </select>
      </div>

      <div class="form-group">
        <label>Deskripsi</label>
        <textarea rows="3" placeholder="Deskripsi singkat produk"></textarea>
      </div>
    </div>

    <div class="form-section">
      <h3>Berat dan Dimensi</h3>

      <div class="form-group">
        <label>Berat (gram)</label>
        <input type="number" placeholder="200">
      </div>

      <div class="form-group">
        <label>Panjang (cm)</label>
        <input type="number" placeholder="30">
      </div>

      <div class="form-group">
        <label>Lebar (cm)</label>
        <input type="number" placeholder="25">
      </div>

      <div class="form-group">
        <label>Tinggi (cm)</label>
        <input type="number" placeholder="2">
      </div>
    </div>

    <div class="form-section">
      <h3>Varian Produk</h3>

      <div class="form-group">
        <label>Warna</label>
        <input type="text" placeholder="Hitam">
      </div>

      <div class="form-group">
        <label>Ukuran</label>
        <select>
          <option>S</option>
          <option>M</option>
          <option>L</option>
          <option>XL</option>
        </select>
      </div>

      <div class="form-group">
        <label>Stok Varian</label>
        <input type="number" placeholder="40">
      </div>
    </div>

    <div class="form-section">
      <h3>Harga dan Status</h3>

      <div class="form-group">
        <label>Harga Jual (Rp)</label>
        <input type="number" placeholder="75000">
      </div>

      <div class="form-group">
        <label>Status</label>
        <select>
          <option>Aktif</option>
          <option>Nonaktif</option>
        </select>
      </div>

      <div class="form-group">
        <label>Foto Produk</label>
        <input type="file">
      </div>
    </div>

    <button type="submit" class="btn">Simpan</button>
    <a href="index.html" class="btn-hapus">Batal</a>

  </form>
</div>

</body>
</html>
